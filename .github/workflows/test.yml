name: Android Tests
on: 
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        api-level: [29,34]
        target: [default]

    steps:
      - name: Checkout
        uses:  actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  #6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  #5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e  #6.1.0
      
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle Cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  #v5.0.4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-


      - name: Build with Gradle
        run: ./gradlew assembleDebug


      - name: Run tests (with Suntimes)
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a    # v2.37.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_7_pro
          script:
            adb wait-for-device ;
            curl -O https://forrestguice.github.io/SuntimesApps/repo/com.forrestguice.suntimeswidget_133.apk &&
            adb install com.forrestguice.suntimeswidget_133.apk ;
            adb shell pm grant com.forrestguice.suntimescalendars android.permission.POST_NOTIFICATIONS ;
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notAnnotation=com.forrestguice.suntimeswidget.calendar.ScreenshotCreator || exit_code=$? ;
            exit $exit_code


      - name: Upload artifacts (test report)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  #7.0.0
        with:
          name: android-test-report-${{ matrix.api-level }}
          path: app/build/reports/androidTests/connected/debug/

      - name: Upload artifacts (screenshots)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  #7.0.0
        with:
          name: android-test-outputs-${{ matrix.api-level }}
          path: app/build/outputs/connected_android_test_additional_output/
          
