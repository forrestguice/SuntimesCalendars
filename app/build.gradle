plugins {
    id 'com.android.application'
    id 'suntimes.localization.plugin'
}

android {
    namespace = "com.forrestguice.suntimescalendars"

    defaultConfig {
        applicationId "com.forrestguice.suntimescalendars"

        compileSdk 34

        //noinspection MinSdkTooLow
        minSdkVersion 14
        //noinspection EditedTargetSdkVersion,ExpiredTargetSdkVersion,OldTargetApi
        targetSdkVersion 34
        versionCode 21
        versionName "0.6.3"

        buildConfigField "String", "GIT_HASH", "\"${getGitHash()}\""
        resConfigs "ca", "cs", "de", "en", "eo", "es", "eu", "fr", "hu", "it", "nb", "nl", "pl", "pt", "ru", "zh"

        def suntimesApplicationId = "com.forrestguice.suntimeswidget"
        def suntimesPermissionRoot = "suntimes"
        manifestPlaceholders.suntimesApplicationId = "$suntimesApplicationId"
        manifestPlaceholders.suntimesPermissionRoot = "$suntimesPermissionRoot"
        buildConfigField "String", "SUNTIMES_PERMISSION_ROOT", "\"$suntimesPermissionRoot\""

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        missingDimensionStrategy 'support_version', 'androidx'
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    lintOptions
    {
        disable 'MissingTranslation'
    }
}

dependencies {
    implementation project(path: ":SuntimesAddon")     //implementation 'com.github.forrestguice:SuntimesAddon:v0.5.1'
    implementation 'androidx.core:core:1.6.0'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    testImplementation 'junit:junit:4.12'

    androidTestImplementation 'com.jraska:falcon:2.2.0'
    androidTestImplementation 'androidx.annotation:annotation:1.1.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:rules:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

def getGitHash()
{
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'rev-parse', '--short', 'HEAD'
        standardOutput = stdout
    }
    return stdout.toString().trim()
}

localization_plugin {
    baseNames = 'strings'
    excludeLocales = 'en|en-rUS'
    inputDir = layout.projectDirectory.dir('src/main/res').toString()
    outputDir = "${buildDir}/generated/localization"
}
